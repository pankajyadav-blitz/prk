name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc

      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive_name="prk-${{ matrix.target }}.zip"
            (cd "target/${{ matrix.target }}/release" && 7z a -tzip "$GITHUB_WORKSPACE/$archive_name" prk.exe)
            sha256sum "$archive_name" > "$archive_name.sha256"
          else
            archive_name="prk-${{ matrix.target }}.tar.gz"
            tar -czf "$archive_name" -C "target/${{ matrix.target }}/release" prk
            shasum -a 256 "$archive_name" > "$archive_name.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prk-${{ matrix.target }}
          path: prk-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the installer, service file and VERSION
        run: |
          cp install.sh install.ps1 prk.service config.example.toml dist/
          echo "$GITHUB_REF_NAME" > dist/VERSION

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
