[package]
name = "prk"
version = "0.1.0"
edition = "2024"
description = "Review GitHub PRs with Claude Code when someone tags the reviewer in a Slack channel"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
toml = "1.1.6"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
